<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img" aria-labelledby="title description">
  <title id="title">Jumpkut</title>
  <desc id="description">Your clipboard, a shortcut away. A native clipboard manager for Linux and X11.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201a35"/>
      <stop offset="1" stop-color="#33254f"/>
    </linearGradient>
    <clipPath id="edge"><rect width="1280" height="370" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="1280" height="370" fill="url(#background)"/>
    <circle cx="1180" cy="28" r="205" fill="#7863cf" opacity="0.11"/>
    <circle cx="1180" cy="28" r="140" fill="none" stroke="#a28de8" stroke-width="1.5" opacity="0.23"/>
    <circle cx="1180" cy="28" r="270" fill="none" stroke="#a28de8" stroke-width="1.5" opacity="0.14"/>
    <circle cx="90" cy="385" r="155" fill="#7863cf" opacity="0.09"/>
  </g>
  <g transform="translate(114 85) scale(4.4)">
    <rect x="1" y="1" width="30" height="30" rx="8" fill="#7863cf"/>
    <g fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="23" r="3.2"/><circle cx="22" cy="23" r="3.2"/>
      <path d="M12 20.5 23.5 7.5M20 20.5 8.5 7.5"/>
    </g>
  </g>
  <text x="294" y="170" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="88" font-weight="700" letter-spacing="-3">Jumpkut</text>
  <text x="299" y="225" fill="#d7cdef" font-family="DejaVu Sans, sans-serif" font-size="28">Your clipboard, a shortcut away.</text>
  <rect x="300" y="268" width="147" height="35" rx="17.5" fill="#7863cf" opacity="0.38"/>
  <text x="373.5" y="291" text-anchor="middle" fill="#f2edff" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" letter-spacing="1">LINUX / X11</text>
  <rect x="459" y="268" width="110" height="35" rx="17.5" fill="#7863cf" opacity="0.38"/>
  <text x="514" y="291" text-anchor="middle" fill="#f2edff" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ALT + C</text>
  <text x="590" y="291" fill="#bcaedb" font-family="DejaVu Sans, sans-serif" font-size="16">Copy. Browse. Paste.</text>
</svg>
