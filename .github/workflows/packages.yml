name: Linux packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Build the portable runtime on the oldest supported Ubuntu baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        shell: bash
        run: |
          version=$(/usr/bin/python3 -c 'import sys; sys.path.insert(0, "scripts"); from package_common import application_version; print(application_version())')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the application version in Cargo.toml: v$version" >&2
            exit 1
          fi
          echo "JUMPKUT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          cargo --version

      - name: Install packaging tools and run-time libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            curl desktop-file-utils dpkg-dev rpm cpio binutils \
            libegl1 libgl1 libgl1-mesa-dri libfontconfig1 fonts-dejavu-core libwayland-client0 libwayland-egl1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrender1 \
            xvfb dbus

      - name: Build (glibc 2.35 baseline) and test
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
          cargo test --release --locked
          /usr/bin/python3 -m unittest discover -s tests -v
          ./scripts/smoke-test.sh

      - name: Build Debian, RPM and AppImage packages
        run: |
          ./scripts/build-deb.py --output-dir dist
          ./scripts/build-rpm.py --output-dir dist
          ./scripts/build-appimage.sh --output-dir dist

      - name: Test installed Debian package
        run: |
          sudo apt-get install -y ./dist/jumpkut_*_amd64.deb
          test "$(/usr/bin/jumpkut --version)" = "Jumpkut $JUMPKUT_VERSION"
          ./scripts/smoke-test.sh /usr/bin/jumpkut

      - name: Test portable AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          image="$PWD/dist/Jumpkut-$JUMPKUT_VERSION-x86_64.AppImage"
          "$image" --version
          ./scripts/smoke-test.sh "$image"

      - name: Prepare checksums and release notes
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm ./*.AppImage > SHA256SUMS
          sha256sum --check SHA256SUMS
          /usr/bin/python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          version = os.environ['JUMPKUT_VERSION']
          changelog = Path('../CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit('The release version must have changelog notes')
          notes = (f'Jumpkut {version} for Linux (X11 and KDE Plasma Wayland).\n\n' + match.group(1).strip() +
                   '\n\n### Downloads\n\n' +
                   '- **.deb**: Debian, Ubuntu, and Linux Mint (x86_64); install with `sudo apt install ./jumpkut_*_amd64.deb`.\n' +
                   '- **.rpm**: Fedora (x86_64); install with `sudo dnf install ./jumpkut-*.x86_64.rpm`.\n' +
                   '- **.AppImage**: portable x86_64 build for glibc 2.35 or newer. Make executable, then run.\n' +
                   '\nAll formats run on X11 or KDE Plasma Wayland (with wl-clipboard 2.3+). Download SHA256SUMS to verify package checksums.\n\n' +
                   '[Installation and upgrade guide](https://github.com/patrick-hudson/jumpkut#installation)\n')
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PYTHON

      - name: Save installable packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  portable:
    name: AppImage on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install run-time libraries and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libgl1-mesa-dri libfontconfig1 fonts-dejavu-core libwayland-client0 libwayland-egl1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrender1 \
            xvfb dbus

      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Test the AppImage on a newer Linux host
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          version=$(/usr/bin/python3 -c 'import sys; sys.path.insert(0, "scripts"); from package_common import application_version; print(application_version())')
          image="$PWD/dist/Jumpkut-$version-x86_64.AppImage"
          chmod +x "$image"
          test "$("$image" --version)" = "Jumpkut $version"
          ./scripts/smoke-test.sh "$image"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft \
              --title "Jumpkut ${tag#v}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" ./*.deb ./*.rpm ./*.AppImage SHA256SUMS --clobber
          release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          # Automatic date/version ordering keeps an older tagged rerun from
          # replacing a newer release at /releases/latest.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy --silent
