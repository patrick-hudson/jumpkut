name: Linux packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Build the portable runtime on the oldest supported Ubuntu baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        shell: bash
        run: |
          version=$(/usr/bin/python3 -c 'from jumpkut import __version__; print(__version__)')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the application version: v$version" >&2
            exit 1
          fi
          echo "JUMPKUT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3-gi gir1.2-gtk-3.0 python3-xlib librsvg2-common \
            libgtk-3-dev libgtk-3-bin libgdk-pixbuf2.0-bin librsvg2-dev libgirepository1.0-dev \
            pkg-config file curl patchelf desktop-file-utils dpkg-dev rpm cpio \
            xvfb metacity dbus-x11

      - name: Run headless and native tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          ./scripts/test-desktop.sh

      - name: Build Debian and RPM packages
        run: |
          ./scripts/build-deb.py --output-dir dist
          ./scripts/build-rpm.py --output-dir dist

      - name: Build bundled AppImage
        run: ./scripts/build-appimage.sh --output-dir dist

      - name: Test installed Debian package
        run: |
          sudo apt-get install -y ./dist/jumpkut_*_all.deb
          /usr/bin/jumpkut --version
          JUMPKUT_TEST_LAUNCHER=/usr/bin/jumpkut ./scripts/test-desktop.sh

      - name: Test portable AppImage background and desktop commands
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          image="$PWD/dist/Jumpkut-$JUMPKUT_VERSION-x86_64.AppImage"
          "$image" --version
          JUMPKUT_TEST_LAUNCHER="$image" ./scripts/test-desktop.sh

      - name: Prepare checksums and release notes
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm ./*.AppImage > SHA256SUMS
          sha256sum --check SHA256SUMS
          /usr/bin/python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          version = os.environ['JUMPKUT_VERSION']
          changelog = Path('../CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit('The release version must have changelog notes')
          notes = (f'Jumpkut {version} for Linux/X11.\n\n' + match.group(1).strip() +
                   '\n\n### Downloads\n\n' +
                   '- **.deb**: Debian, Ubuntu, and Linux Mint; install with `sudo apt install ./jumpkut_*_all.deb`.\n' +
                   '- **.rpm**: Fedora; install with `sudo dnf install ./jumpkut-*.noarch.rpm`.\n' +
                   '- **.AppImage**: portable x86_64 runtime for glibc 2.35 or newer. Make executable, then run.\n' +
                   '\nAll formats require an X11 session. Download SHA256SUMS to verify package checksums.\n\n' +
                   '[Installation and upgrade guide](https://github.com/patrick-hudson/jumpkut#installation)\n')
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          PYTHON

      - name: Save installable packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  portable:
    name: AppImage on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install desktop test dependencies and newer host GIO modules
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3-gi gir1.2-gtk-3.0 python3-xlib librsvg2-common \
            xvfb metacity dbus-x11 gvfs

      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Test portable runtime on a newer Linux host
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          version=$(/usr/bin/python3 -c 'from jumpkut import __version__; print(__version__)')
          image="$PWD/dist/Jumpkut-$version-x86_64.AppImage"
          chmod +x "$image"
          "$image" --version > "$RUNNER_TEMP/appimage-version.log" 2> "$RUNNER_TEMP/appimage-stderr.log"
          cat "$RUNNER_TEMP/appimage-version.log" "$RUNNER_TEMP/appimage-stderr.log"
          grep -Fx "Jumpkut $version" "$RUNNER_TEMP/appimage-version.log"
          test ! -s "$RUNNER_TEMP/appimage-stderr.log"
          JUMPKUT_TEST_LAUNCHER="$image" ./scripts/test-desktop.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft \
              --title "Jumpkut ${tag#v}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" ./*.deb ./*.rpm ./*.AppImage SHA256SUMS --clobber
          release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          # Automatic date/version ordering keeps an older tagged rerun from
          # replacing a newer release at /releases/latest.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy --silent
