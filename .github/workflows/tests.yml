name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          cargo --version

      - name: Install run-time libraries and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libgl1-mesa-dri libfontconfig1 fonts-dejavu-core libwayland-client0 libwayland-egl1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrender1 \
            xvfb dbus rpm

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and unit tests
        run: |
          cargo build --release --locked
          cargo test --release --locked

      - name: Tooling tests (installer, release, packaging)
        run: /usr/bin/python3 -m unittest discover -s tests -v

      - name: Smoke test on Xvfb
        run: ./scripts/smoke-test.sh
